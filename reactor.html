<!DOCTYPE html>
<html lang="en">
<head>
<script src="demo_config.js"></script>
<script src="voice_map.js"></script>
<script src="demo_wake.js"></script>
<meta charset="utf-8">
<title>V.E.R.A.</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #3fd9ff;
    --dim: #7fb8cc;
    --bg: #030910;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    color: var(--dim);
    background:
      radial-gradient(ellipse at center, rgba(20, 60, 85, 0.22) 0%, rgba(3, 9, 16, 0) 62%),
      linear-gradient(rgba(63, 217, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63, 217, 255, 0.025) 1px, transparent 1px),
      var(--bg);
    background-size: 100% 100%, 44px 44px, 44px 44px, 100% 100%;
    cursor: default;
    user-select: none;
  }
  #reactor { position: fixed; inset: 0; width: 100%; height: 100%; }

  .corner {
    position: fixed;
    font-size: 13px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(127, 184, 204, 0.75);
    z-index: 3;
  }
  .corner b { color: var(--cyan); font-weight: 600; }
  #c-tl { top: 22px; left: 26px; }
  #c-tr { top: 22px; right: 26px; text-align: right; }
  #c-br { bottom: 22px; right: 26px; text-align: right; }
  #c-tl .sub, #c-tr .sub, #c-br .sub {
    display: block; margin-top: 5px; font-size: 10px;
    letter-spacing: 0.26em; color: rgba(127, 184, 204, 0.42);
  }
  #model-badge {
    display: inline-block; margin-top: 7px; padding: 2px 10px;
    border: 1px solid rgba(63, 217, 255, 0.55); border-radius: 3px;
    color: var(--cyan); font-size: 10px; letter-spacing: 0.28em;
    text-shadow: 0 0 10px rgba(63, 217, 255, 0.4);
  }
  #link-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 8px; vertical-align: 1px;
    background: #ff5f6b; box-shadow: 0 0 8px #ff5f6b;
    transition: background 0.4s, box-shadow 0.4s;
  }
  body.online #link-dot { background: #46f0a0; box-shadow: 0 0 8px #46f0a0; }

  /* corner frame brackets */
  .bracket { position: fixed; width: 26px; height: 26px; z-index: 2; opacity: 0.5; }
  .bracket::before { content: ''; position: absolute; inset: 0; border: 1px solid var(--cyan); }
  #b-tl { top: 14px; left: 14px; } #b-tl::before { border-right: 0; border-bottom: 0; }
  #b-tr { top: 14px; right: 14px; } #b-tr::before { border-left: 0; border-bottom: 0; }
  #b-bl { bottom: 14px; left: 14px; } #b-bl::before { border-right: 0; border-top: 0; }
  #b-br { bottom: 14px; right: 14px; } #b-br::before { border-left: 0; border-top: 0; }

  #status-wrap {
    position: fixed; left: 0; right: 0; top: 71.5%;
    text-align: center; z-index: 3; pointer-events: none;
  }
  #status {
    display: inline-block; font-size: 21px; font-weight: 500;
    letter-spacing: 0.62em; text-indent: 0.62em; text-transform: uppercase;
    color: var(--cyan); text-shadow: 0 0 18px rgba(63, 217, 255, 0.55);
    transition: color 0.5s, text-shadow 0.5s;
  }
  #status-sub {
    margin-top: 8px; font-size: 11px; letter-spacing: 0.4em; text-indent: 0.4em;
    color: rgba(127, 184, 204, 0.5); text-transform: uppercase;
  }

  #nav-map {
    position: fixed; top: 64px; left: 26px; z-index: 4;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    color: rgba(63, 217, 255, 0.75); text-decoration: none;
    border: 1px solid rgba(63, 217, 255, 0.3); border-radius: 3px;
    padding: 4px 12px; transition: all 0.3s;
  }
  #nav-map:hover { color: var(--cyan); border-color: var(--cyan);
    text-shadow: 0 0 12px rgba(63, 217, 255, 0.6); }

  #cards {
    position: fixed; top: 96px; right: 26px; z-index: 4;
    width: min(340px, 30vw); display: flex; flex-direction: column; gap: 12px;
  }
  .card {
    background: rgba(8, 22, 34, 0.82); border: 1px solid rgba(63, 217, 255, 0.35);
    border-left: 3px solid var(--cyan); border-radius: 4px; padding: 12px 14px;
    backdrop-filter: blur(6px);
    animation: card-in 0.45s cubic-bezier(0.2, 0.9, 0.3, 1);
    box-shadow: 0 0 24px rgba(63, 217, 255, 0.12);
  }
  @keyframes card-in { from { opacity: 0; transform: translateX(40px); } }
  .card h3 {
    font-size: 12px; font-weight: 600; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--cyan); margin-bottom: 7px;
  }
  .card li {
    list-style: none; font-size: 13.5px; line-height: 1.5; color: #cfe4ec;
    padding-left: 12px; position: relative;
  }
  .card li::before { content: '▸'; position: absolute; left: 0; color: rgba(63, 217, 255, 0.6); }
  .card button {
    margin-top: 9px; background: none; border: 1px solid rgba(63, 217, 255, 0.4);
    border-radius: 3px; color: var(--cyan); font-family: inherit; font-size: 10px;
    letter-spacing: 0.3em; padding: 4px 12px; cursor: pointer;
  }
  .card button:hover { background: rgba(63, 217, 255, 0.12); }

  #transcript {
    position: fixed; left: 28px; bottom: 26px; z-index: 3;
    width: min(460px, 44vw); max-height: 38vh; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
    -webkit-mask-image: linear-gradient(transparent 0%, black 26%);
            mask-image: linear-gradient(transparent 0%, black 26%);
  }
  .line { margin-top: 11px; font-size: 15.5px; line-height: 1.45; letter-spacing: 0.04em; }
  .line .who {
    font-size: 10.5px; letter-spacing: 0.3em; display: block;
    margin-bottom: 1px; opacity: 0.65;
  }
  .line.user  { color: #cfe4ec; }
  .line.user .who { color: #8fb3c4; }
  .line.jarvis { color: var(--cyan); text-shadow: 0 0 12px rgba(63, 217, 255, 0.25); }
  .line.jarvis .who { color: #ffc255; }
  .caret { display: inline-block; width: 8px; margin-left: 2px;
           background: var(--cyan); height: 1em; vertical-align: -2px;
           animation: blink 0.85s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="reactor"></canvas>

<div class="bracket" id="b-tl"></div><div class="bracket" id="b-tr"></div>
<div class="bracket" id="b-bl"></div><div class="bracket" id="b-br"></div>

<div class="corner" id="c-tl"><b>V.E.R.A.</b><span class="sub">Virtual Execution & Response Assistant</span></div>
<div class="corner" id="c-tr"><b id="clock">--:--:--</b><span class="sub" id="date-line">&nbsp;</span></div>
<div class="corner" id="c-br"><span id="link-dot"></span><span id="link-label">LINK OFFLINE</span><span class="sub">ws 127.0.0.1:<span id="port-label">8765</span></span><span class="sub"><span id="model-badge">◆ STANDBY</span></span><span class="sub" id="tokens-line">COGNITION —</span></div>

<a id="nav-map" href="#">◈ Brain Map</a>
<div id="cards"></div>

<div id="status-wrap">
  <div id="status">LINK OFFLINE</div>
  <div id="status-sub">PUBLIC MODEL &nbsp;//&nbsp; SANDBOXED</div>
</div>

<div id="transcript"></div>

<script>
'use strict';

/* ---------------------------------------------------------------- modes */
/* Mirrors the states sent by hud.py: idle | listening | thinking | speaking */
const MODES = {
  offline:   { color: [214,  84,  98], text: 'LINK OFFLINE', speed: 0.20, glow: 0.28 },
  idle:      { color: [ 47, 148, 187], text: 'STANDING BY',  speed: 0.38, glow: 0.50 },
  listening: { color: [ 63, 217, 255], text: 'LISTENING',    speed: 1.00, glow: 0.90 },
  thinking:  { color: [255, 194,  85], text: 'PROCESSING',   speed: 2.60, glow: 0.80 },
  speaking:  { color: [189, 239, 255], text: 'SPEAKING',     speed: 1.15, glow: 1.00 },
};

let mode = 'offline';
const cur = { color: [214, 84, 98], speed: 0.2, glow: 0.28 };  // eased toward MODES[mode]
let level = 0, targetLevel = 0;
const levelHistory = new Array(56).fill(0);

function setMode(name) {
  if (!(name in MODES) || name === mode) return;
  mode = name;
  document.getElementById('status').textContent = MODES[name].text;
  document.body.classList.toggle('online', name !== 'offline');
  document.getElementById('link-label').textContent = name === 'offline' ? 'LINK OFFLINE' : 'LINK ONLINE';
}

/* ---------------------------------------------------------------- canvas */
const canvas = document.getElementById('reactor');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = canvas.width = Math.floor(innerWidth * DPR);
  H = canvas.height = Math.floor(innerHeight * DPR);
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
}
addEventListener('resize', resize);
resize();

const RINGS = [
  { r: 0.34, w: 1.6, dash: null,       speed:  0.0,   alpha: 0.50 },
  { r: 0.46, w: 9,   dash: [42, 26],   speed:  0.055, alpha: 0.85 },
  { r: 0.58, w: 2,   dash: [3, 11],    speed: -0.085, alpha: 0.60 },
  { r: 0.74, w: 15,  dash: [86, 96],   speed:  0.028, alpha: 0.34 },
  { r: 0.86, w: 1,   dash: null,       speed:  0.0,   alpha: 0.22 },
  { r: 1.00, w: 3,   dash: [2, 26],    speed:  0.014, alpha: 0.30 },
];

const lerp = (a, b, k) => a + (b - a) * k;
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// Rotation phase is the integral of eased speed over time — multiplying
// absolute time by a changing speed makes the dashes strobe on transitions.
let phase = 0, lastNow = 0;

function draw(now) {
  const m = MODES[mode];
  if (!lastNow) lastNow = now;
  phase += (now - lastNow) * cur.speed;
  lastNow = now;
  // ease colors / speed / glow toward the active mode
  for (let i = 0; i < 3; i++) cur.color[i] = lerp(cur.color[i], m.color[i], 0.06);
  cur.speed = lerp(cur.speed, m.speed, 0.05);
  cur.glow = lerp(cur.glow, m.glow, 0.05);

  // ease the mic level; synthesize one while speaking / thinking
  if (mode === 'speaking') {
    targetLevel = 0.28 + 0.30 * Math.abs(Math.sin(now * 0.011) + 0.5 * Math.sin(now * 0.023));
  } else if (mode === 'thinking') {
    targetLevel = 0.10 + 0.05 * Math.sin(now * 0.006);
  } else if (mode !== 'listening') {
    targetLevel = 0;
  }
  level = lerp(level, targetLevel, 0.18);
  levelHistory.push(level);
  levelHistory.shift();

  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.44;
  const R = Math.min(W, H) * 0.21;
  const breathe = 1 + 0.012 * Math.sin(now * 0.0016);

  // core glow
  const coreR = R * 0.30 * (1 + level * 0.5) * breathe;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 2.6);
  g.addColorStop(0, rgba(cur.color, 0.85 * cur.glow));
  g.addColorStop(0.35, rgba(cur.color, 0.28 * cur.glow));
  g.addColorStop(1, rgba(cur.color, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, coreR * 2.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = rgba([230, 250, 255], 0.9 * cur.glow);
  ctx.beginPath();
  ctx.arc(cx, cy, coreR * 0.42, 0, Math.PI * 2);
  ctx.fill();

  // rings — glow is a wide faint under-stroke (shadowBlur is far too slow)
  for (const ring of RINGS) {
    const rr = R * ring.r * breathe * (1 + level * 0.08);
    const dash = ring.dash ? ring.dash.map(d => d * DPR) : [];
    const off = phase * ring.speed * DPR;

    ctx.setLineDash(dash);
    ctx.lineDashOffset = off;

    ctx.beginPath();
    ctx.strokeStyle = rgba(cur.color, ring.alpha * 0.22 * cur.glow);
    ctx.lineWidth = (ring.w + 8) * DPR * 0.75;
    ctx.arc(cx, cy, rr, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.strokeStyle = rgba(cur.color, ring.alpha * (0.55 + 0.45 * cur.glow));
    ctx.lineWidth = ring.w * DPR * 0.75;
    ctx.arc(cx, cy, rr, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // tick ring — two batched paths (short/long) instead of 72 strokes
  const tickR = R * 0.66 * breathe;
  const tickSpin = phase * 0.0036;
  for (const long of [false, true]) {
    ctx.beginPath();
    for (let i = 0; i < 72; i++) {
      if ((i % 6 === 0) !== long) continue;
      const a = (i / 72) * Math.PI * 2 + tickSpin;
      const half = (long ? 8 : 4) * DPR;
      ctx.moveTo(cx + Math.cos(a) * (tickR - half), cy + Math.sin(a) * (tickR - half));
      ctx.lineTo(cx + Math.cos(a) * (tickR + half), cy + Math.sin(a) * (tickR + half));
    }
    ctx.strokeStyle = rgba(cur.color, long ? 0.5 : 0.22);
    ctx.lineWidth = DPR;
    ctx.stroke();
  }

  // voice ripple
  if (level > 0.02) {
    ctx.strokeStyle = rgba(cur.color, Math.min(0.5, level));
    ctx.lineWidth = 2 * DPR;
    ctx.beginPath();
    ctx.arc(cx, cy, R * (1.04 + level * 0.30), 0, Math.PI * 2);
    ctx.stroke();
  }

  // waveform bars under the reactor
  const barCount = levelHistory.length;
  const span = R * 2.4;
  const barW = span / barCount * 0.55;
  const baseY = cy + R * 1.55;
  for (let i = 0; i < barCount; i++) {
    const v = levelHistory[i];
    const h = Math.max(1.5 * DPR, v * R * 0.5);
    const x = cx - span / 2 + (i / barCount) * span;
    ctx.fillStyle = rgba(cur.color, 0.14 + v * 0.7);
    ctx.fillRect(x, baseY - h / 2, barW, h);
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ------------------------------------------------------------- transcript */
const transcriptEl = document.getElementById('transcript');
const typeQueue = [];
let typing = false;
let typeTimer = null;

function addLine(who, text) {
  const div = document.createElement('div');
  div.className = 'line ' + who;
  const label = document.createElement('span');
  label.className = 'who';
  label.textContent = who === 'user' ? 'YOU' : 'V.E.R.A.';
  const body = document.createElement('span');
  body.className = 'body';
  div.append(label, body);
  transcriptEl.appendChild(div);
  while (transcriptEl.children.length > 8) transcriptEl.firstChild.remove();

  if (who === 'jarvis') {
    typeQueue.push({ el: body, text });
    pumpTyping();
  } else {
    body.textContent = text;
  }
}

function pumpTyping() {
  if (typing) return;
  const job = typeQueue.shift();
  if (!job) return;
  typing = true;
  const caret = document.createElement('span');
  caret.className = 'caret';
  job.el.after(caret);
  let i = 0;
  typeTimer = setInterval(() => {
    i = Math.min(job.text.length, i + 2);
    job.el.textContent = job.text.slice(0, i);
    if (i >= job.text.length) {
      clearInterval(typeTimer);
      caret.remove();
      typing = false;
      pumpTyping();
    }
  }, 17);
}

// Shared reset: reconnects and the demo takeover (demo_live.js) both need the
// typewriter stopped, not just the DOM cleared — a detached job blocks the queue.
window.VERA_TRANSCRIPT_RESET = () => {
  clearInterval(typeTimer);
  typing = false;
  typeQueue.length = 0;
  transcriptEl.replaceChildren();
};

/* ------------------------------------------------------------------ clock */
function tickClock() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent =
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  document.getElementById('date-line').textContent =
    d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' }).toUpperCase();
}
setInterval(tickClock, 1000);
tickClock();

/* -------------------------------------------------------------- websocket */
const params = new URLSearchParams(location.search);
const port = params.get('port') || '8765';
const DEMO = params.has('demo');
document.getElementById('port-label').textContent = DEMO ? 'demo' : port;
document.getElementById('nav-map').href = DEMO ? 'map.html?demo=1' : 'map.html?demo=1&x=' + port;
let ws = null;

function connect() {
  ws = new WebSocket(`ws://127.0.0.1:${port}`);
  ws.onopen = () => {
    // The server replays state + cards + recent transcript on connect; start
    // clean so a reconnect doesn't duplicate what's already on screen.
    window.VERA_TRANSCRIPT_RESET();
    document.getElementById('cards').replaceChildren();
  };
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === 'state') setMode(m.v);
    else if (m.t === 'level') targetLevel = Math.max(0, Math.min(1, m.v));
    else if (m.t === 'user' || m.t === 'jarvis') addLine(m.t, m.v);
    else if (m.t === 'card') {
      const c = m.v || {};
      const div = document.createElement('div');
      div.className = 'card';
      const h = document.createElement('h3');
      h.textContent = c.title || 'Briefing';
      const ul = document.createElement('ul');
      for (const line of (c.lines || [])) {
        const li = document.createElement('li');
        li.textContent = line;
        ul.appendChild(li);
      }
      const btn = document.createElement('button');
      btn.textContent = 'GOT IT';
      btn.onclick = () => div.remove();
      div.append(h, ul, btn);
      const cardsEl = document.getElementById('cards');
      cardsEl.appendChild(div);
      while (cardsEl.children.length > 3) cardsEl.firstChild.remove();
    }
    else if (m.t === 'usage') {
      const u = m.v || {};
      if (u.model) {
        document.getElementById('model-badge').textContent =
          '◆ ' + String(u.model).toUpperCase().replace('CLAUDE-', '').replace(/\[1M\]$/, '');
      }
      const k = n => n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K' : String(n | 0);
      const t = u.total || {}, l = u.last || {};
      document.getElementById('tokens-line').textContent =
        `TURN ${k(l.input_tokens || 0)}→${k(l.output_tokens || 0)} · Σ ${k((t.input_tokens || 0) + (t.output_tokens || 0))} TOK · ${t.turns || 0} TURNS`;
    }
  };
  ws.onclose = () => { setMode('offline'); setTimeout(connect, 1500); };
  ws.onerror = () => { try { ws.close(); } catch {} };
}

/* ---------------------------------------------------------- demo mode */
function runDemo() {
  document.body.classList.add('online');
  document.getElementById('link-label').textContent = 'DEMO MODE';
  document.getElementById('model-badge').textContent =
    window.DEMO_API ? '◆ SANDBOXED' : '◆ REHEARSAL';  // don't clobber the live indicator
  let totalIn = 41200, totalOut = 6800, turns = 12;
  const usage = (i, o) => {
    totalIn += i; totalOut += o; turns++;
    const k = n => n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K' : String(n | 0);
    document.getElementById('tokens-line').textContent =
      `TURN ${k(i)}→${k(o)} · Σ ${k(totalIn + totalOut)} TOK · ${turns} TURNS`;
  };
  const card = (title, lines) => {
    const div = document.createElement('div'); div.className = 'card';
    const h = document.createElement('h3'); h.textContent = title;
    const ul = document.createElement('ul');
    for (const l of lines) { const li = document.createElement('li'); li.textContent = l; ul.appendChild(li); }
    const btn = document.createElement('button'); btn.textContent = 'GOT IT'; btn.onclick = () => div.remove();
    div.append(h, ul, btn);
    const el = document.getElementById('cards'); el.appendChild(div);
    while (el.children.length > 3) el.firstChild.remove();
  };
  const steps = [
    [1200, () => { setMode('idle'); document.getElementById('cards').replaceChildren(); window.VERA_HUB && window.VERA_HUB.reset(); }],
    [2400, () => { setMode('listening'); targetLevel = 0.5; }],
    [2400, () => { addLine('user', 'Hey Vera, what’s on the docket today?'); setMode('thinking'); }],
    [2600, () => { const l = 'Three items, sir: the client proposal, a suspiciously empty calendar, and your ongoing refusal to take lunch.'; setMode('speaking'); addLine('jarvis', l); window.VERA_SPEAK && window.VERA_SPEAK(l); usage(2100, 340); }],
    [5200, () => { setMode('listening'); targetLevel = 0.45; }],
    [2300, () => { addLine('user', 'Research CRM options for a small consultancy.'); setMode('thinking'); }],
    [3400, () => { const l = 'On the wires now, sir — the short answer: three contenders, one clear value pick. Card’s on your display.'; setMode('speaking'); addLine('jarvis', l); window.VERA_SPEAK && window.VERA_SPEAK(l); card('CRM SCAN — SMALL CONSULTANCY', ['Option A — free tier, 2-seat cap, best API', 'Option B — $12/mo, native email sync', 'Option C — $29/mo, overkill until 50+ clients', 'Value pick: Option B — migration path to C is clean']); usage(8400, 620); }],
    [5200, () => { setMode('listening'); targetLevel = 0.4; }],
    [2300, () => { addLine('user', 'Show me what you can really do.'); setMode('thinking'); }],
    [2400, () => { const l = 'Now — allow me to show off. I shall build you a live operations hub from nothing.'; setMode('speaking'); addLine('jarvis', l); window.VERA_SPEAK && window.VERA_SPEAK(l); usage(1700, 260); }],
    [3800, () => { document.getElementById('cards').replaceChildren(); if (window.VERA_HUB) { window.VERA_HUB.show('log'); window.VERA_HUB.show('markets'); } const l = 'First: a market feed. Live numbers, straight off the wire.'; setMode('speaking'); addLine('jarvis', l); window.VERA_SPEAK && window.VERA_SPEAK(l); usage(1100, 180); }],
    [4600, () => { window.VERA_HUB && window.VERA_HUB.show('scores'); const l = 'Now the scoreboard — today’s games, as they happen.'; setMode('speaking'); addLine('jarvis', l); window.VERA_SPEAK && window.VERA_SPEAK(l); usage(1300, 170); }],
    [4600, () => { window.VERA_HUB && window.VERA_HUB.show('vitals'); const l = 'A vitals monitor, because one must look after one’s principal.'; setMode('speaking'); addLine('jarvis', l); window.VERA_SPEAK && window.VERA_SPEAK(l); usage(900, 150); }],
    [5000, () => { const l = 'And there it is — a working hub, assembled from scratch while we spoke. Say my name, and I shall build one for you.'; setMode('speaking'); addLine('jarvis', l); window.VERA_SPEAK && window.VERA_SPEAK(l); usage(600, 190); }],
    [9000, () => setMode('idle')],
    [9000, () => {}],
  ];
  let i = 0;
  let reelStopped = false;
  window.VERA_REEL_STOP = () => { reelStopped = true; };
  const next = () => {
    const [wait, fn] = steps[i];
    setTimeout(() => { if (reelStopped) return; fn(); i = (i + 1) % steps.length; next(); }, wait);
  };
  next();
}

if (DEMO) {
  // Attract mode: the reel always performs; any visitor engagement takes
  // over the stage instantly (demo_live.js calls VERA_REEL_STOP).
  document.body.classList.add('online');
  document.getElementById('link-label').textContent = 'DEMO MODE';
  document.getElementById('model-badge').textContent =
    window.DEMO_API ? '◆ SANDBOXED' : '◆ REHEARSAL';
  runDemo();
} else {
  connect();
}
</script>
